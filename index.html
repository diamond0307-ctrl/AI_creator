<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LAB.｜旅するように、働く。</title>

  <meta name="theme-color" content="#071218">
  <link rel="preload" as="image" href="creator2/hero-poster.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#f8fbf7;--navy:#063b78;--yellow:#fff000;--turquoise:#14c8c8;--cta-safe:88px}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#071218;color:var(--ink);font-family:"Noto Sans JP",Hiragino Sans,system-ui,sans-serif}a{color:inherit}img{display:block;max-width:100%}
    .swipe-container{width:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}.swipe-section{position:relative;isolation:isolate;width:100%;height:100dvh;min-height:100dvh;max-height:100dvh;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}.screen-inner{width:min(100% - 40px,1120px);height:100%;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 0 calc(var(--cta-safe) + env(safe-area-inset-bottom) + 12px)}
    .journey-hero{display:flex;background:#173d34}.journey-video{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover}.journey-video{object-position:50% 44%;filter:saturate(.95) contrast(1.16)}.journey-hero::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(6,20,17,.28),rgba(4,18,16,.05) 45%,rgba(3,15,14,.46));pointer-events:none}
    .journey-header{position:absolute;z-index:2;top:max(20px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}.journey-wordmark{font:700 22px/1 Georgia,serif;letter-spacing:.05em;text-decoration:none}.journey-menu{display:grid;gap:7px;width:28px}.journey-menu i{height:1px;background:#fff}.journey-inner{display:flex;align-items:center;justify-content:center;width:min(100% - 40px,960px);margin:auto;padding:calc(env(safe-area-inset-top) + 74px) 0 calc(var(--cta-safe) + env(safe-area-inset-bottom) + 18px)}.journey-copy{display:grid;justify-items:center;width:100%;max-width:780px;padding:0;text-align:center;text-shadow:0 2px 22px rgba(0,0,0,.25)}.journey-eyebrow{margin:0 0 30px;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(9px,2.5vw,13px);font-weight:500;letter-spacing:.19em}.journey-eyebrow::after{content:"";display:block;width:80px;height:1px;margin:28px auto 0;background:rgba(255,255,255,.78)}.journey-title{margin:0;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(46px,13vw,78px);font-weight:500;line-height:1.1;letter-spacing:-.07em}.journey-sub{margin:30px 0 0;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(16px,4.2vw,22px);font-weight:500;line-height:1.7}.journey-meta{width:84px;margin:30px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.75);font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;font-size:11px;font-weight:500;letter-spacing:.12em;white-space:nowrap}.journey-action{width:min(100%,460px);margin-top:28px}.journey-cta{position:relative;display:grid;place-items:center;min-height:61px;padding:12px 52px 12px 18px;border:1px solid rgba(255,255,255,.78);border-radius:999px;background:rgba(255,254,248,.18);color:#fff;text-decoration:none;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(16px,4.4vw,21px);font-weight:500;text-shadow:0 2px 16px rgba(0,0,0,.24);backdrop-filter:blur(2px)}.journey-cta b{position:absolute;right:22px;font-size:25px;font-weight:400}.journey-note{margin:8px 0 0;font-size:10px;font-weight:600;text-align:center}
    .attached-media{display:flex;align-items:center;justify-content:center;background:#071218}.attached-media :is(video,img){display:block;width:auto;max-width:100%;max-height:100%;height:auto;object-fit:contain}
    .sticky-cta{position:fixed;z-index:100;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:none;place-items:center;min-height:58px;padding:10px 54px 10px 18px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:#fbfaf3;color:#263b31;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:15px;font-weight:900;text-decoration:none}.sticky-cta.show{display:grid}.sticky-cta b{position:absolute;right:22px;font-size:21px;font-weight:500}@media(min-width:700px){.sticky-cta{left:50%;right:auto;width:min(420px,calc(100% - 48px));transform:translateX(-50%)}}
    @media(max-height:700px){:root{--cta-safe:78px}.screen-inner{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(var(--cta-safe) + env(safe-area-inset-bottom) + 7px)}.journey-eyebrow{margin-bottom:13px}.journey-eyebrow::after{margin-top:14px}.journey-sub{margin-top:13px}.journey-meta{margin-top:13px}.journey-action{margin-top:14px}}
    @media(prefers-reduced-motion:reduce){.journey-video{display:none}}
  </style>
</head>
<body>
  <main class="swipe-container">
    <section class="journey-hero swipe-section" id="top" aria-labelledby="journey-title">
      <video class="journey-video" autoplay muted loop playsinline preload="auto" poster="creator2/hero-poster.jpg" aria-label="緑豊かな旅の風景"><source src="creator2/LAB.hiro.web.mp4" type="video/mp4"></video>
      <header class="journey-header"><a class="journey-wordmark" href="#top" aria-label="LAB. トップへ">LAB.</a><span class="journey-menu" aria-hidden="true"><i></i><i></i><i></i></span></header>
      <div class="journey-inner"><div class="journey-copy"><p class="journey-eyebrow">7 PEOPLE / 3 MONTHS / ONE JOURNEY</p><h1 class="journey-title" id="journey-title">旅するように、<br>働く。</h1><p class="journey-sub">AIとSNSで、<br>場所に縛られない仕事をつくる3ヶ月。</p><p class="journey-meta">7人限定の少人数制</p><div class="journey-action"><a class="journey-cta" href="https://lin.ee/Q2JH9I2" target="_blank" rel="noopener">ZOOM説明会に申し込む <b aria-hidden="true">→</b></a><p class="journey-note">公式LINEから説明会の日程をご案内します</p></div></div></div>
    </section>
    <section class="attached-media swipe-section" id="answer" aria-label="セカンドビュー"><video autoplay muted loop playsinline preload="metadata" aria-label="セカンドビュー"><source src="creator2/section-02.mp4" type="video/mp4"></video></section>
    <section class="attached-media swipe-section" id="answer-second" aria-label="セクション3"><video autoplay muted loop playsinline preload="metadata" aria-label="セクション3"><source src="creator2/section-03.mp4" type="video/mp4"></video></section>
    <section class="attached-media swipe-section" id="program" aria-label="私たちが目指すこと"><img src="creator2/section-04.png" alt="私たちが目指すこと。月10〜20万円の収入アップ、無理なく続く仕組み、今の暮らしも大切にする、スモールビジネスを応援" width="1080" height="1920" loading="lazy"></section>
  </main>
  <a class="sticky-cta" id="stickyCta" href="https://lin.ee/Q2JH9I2" target="_blank" rel="noopener"><span>ZOOM説明会に申し込む</span><b aria-hidden="true">→</b></a>
  <script>
    const swipeContainer = document.querySelector('.swipe-container');
    const hero = document.querySelector('.journey-hero');
    const sticky = document.getElementById('stickyCta');
    const heroObserver = new IntersectionObserver(([entry]) => {
      sticky.classList.toggle('show', !entry.isIntersecting);
    }, {root: swipeContainer, threshold: .5});
    heroObserver.observe(hero);
  </script>
</body>
</html>
